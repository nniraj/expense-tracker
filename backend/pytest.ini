[pytest]
# pytest configuration file

# Directories to search for tests
testpaths = tests

# Python files to search for test cases
python_files = test_*.py

# Test class names to search for
python_classes = Test*

# Test function names to search for
python_functions = test_*

# Verbosity
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for organizing tests
markers =
    auth: Authentication and authorization tests
    expense: Expense management tests
    category: Category management tests
    jwt: JWT token tests
    model: Database model tests
    slow: Slow running tests
    integration: Integration tests

# Minimum Python version
minversion = 3.8

# Don't collect files or directories
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    env
    venv
